name: "CI/CD Pipeline — Azure AKS"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME:       cicdkma4821
  IMAGE_NAME:     cicd-app
  RESOURCE_GROUP: cicd-rg
  AKS_CLUSTER:    cicd-aks
  JAVA_VERSION:   "17"

jobs:

  # ════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build, test, package with Maven
  # ════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: "Build and Test (Maven)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Set up JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "Compile"
        run: mvn -B compile --no-transfer-progress

      - name: "Run unit and integration tests"
        run: mvn -B test --no-transfer-progress

      - name: "Package application"
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: "Upload test reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 30

      - name: "Upload application JAR"
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 1

  # ════════════════════════════════════════════════════════════════════════
  # JOB 2 — Docker build + push + AKS deploy
  # ════════════════════════════════════════════════════════════════════════
  docker-and-deploy:
    name: "Docker Build, Push and Deploy to AKS"
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Download application JAR"
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: "Verify JAR and context"
        run: |
          ls -lh target/app.jar
          echo "Build context files:"
          find . -maxdepth 2 -not -path './.git/*' | head -30

      # ── AZURE LOGIN FIRST (needed for az acr login) ──────────────────
      - name: "Login to Azure"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Enable ACR admin and login using Azure CLI token ─────────────
      - name: "Enable ACR admin and login"
        run: |
          # Enable admin on ACR (idempotent)
          az acr update --name ${{ env.ACR_NAME }} --admin-enabled true
          # Login Docker to ACR using Azure CLI (uses SP session)
          az acr login --name ${{ env.ACR_NAME }}
          echo "Docker ACR login successful"

      # ── Build & push ─────────────────────────────────────────────────
      - name: "Build, tag and push Docker image"
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_REPO="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"

          echo "=== Building Docker image: $IMAGE_REPO:$SHORT_SHA ==="
          docker build \
            --progress=plain \
            --build-arg APP_VERSION="$SHORT_SHA" \
            -t "$IMAGE_REPO:$SHORT_SHA" \
            -t "$IMAGE_REPO:latest" \
            .

          echo "=== Pushing image: $SHORT_SHA ==="
          docker push "$IMAGE_REPO:$SHORT_SHA"
          docker push "$IMAGE_REPO:latest"

          echo "IMAGE=$IMAGE_REPO:$SHORT_SHA" >> $GITHUB_ENV
          echo "TAG=$SHORT_SHA"               >> $GITHUB_ENV
          echo "IMAGE_REPO=$IMAGE_REPO"       >> $GITHUB_ENV
          echo "SUCCESS: Pushed $IMAGE_REPO:$SHORT_SHA"

      # ── Connect to AKS ───────────────────────────────────────────────
      - name: "Connect to AKS cluster"
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      # ── Install Ansible ──────────────────────────────────────────────
      - name: "Install Ansible"
        run: pip install ansible-core --quiet

      # ── Deploy ───────────────────────────────────────────────────────
      - name: "Deploy with Ansible to AKS"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            -v

      # ── Verify ───────────────────────────────────────────────────────
      - name: "Verify deployment status"
        run: |
          echo "=== Deployment ==="
          kubectl get deployment cicd-app -o wide
          echo "=== Pods ==="
          kubectl get pods -l app=cicd-app -o wide
          echo "=== Service ==="
          kubectl get svc cicd-app-svc

      # ── Summary ──────────────────────────────────────────────────────
      - name: "Write job summary"
        if: always()
        run: |
          echo "## Deployment Summary"                                     >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |"                                         >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|"                                         >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`$IMAGE\` |"                               >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`$TAG\` |"                                   >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |"                   >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |"           >> $GITHUB_STEP_SUMMARY
          echo "| **AKS Cluster** | \`${{ env.AKS_CLUSTER }}\` |"        >> $GITHUB_STEP_SUMMARY
          echo "| **Resource Group** | \`${{ env.RESOURCE_GROUP }}\` |"  >> $GITHUB_STEP_SUMMARY