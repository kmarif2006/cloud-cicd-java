name: CI-CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: cicdkma4821
  IMAGE_NAME: cicd-app
  RESOURCE_GROUP: cicd-rg
  AKS_CLUSTER: cicd-aks

jobs:
  build-and-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  docker-and-deploy:
    name: Docker Build, Push and Deploy to AKS
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build, tag and push Docker image
        run: |
          IMAGE_REPO=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          TAG=${GITHUB_SHA::7}
          docker build --build-arg APP_VERSION=$TAG -t $IMAGE_REPO:$TAG -t $IMAGE_REPO:latest .
          docker push $IMAGE_REPO:$TAG
          docker push $IMAGE_REPO:latest
          echo "IMAGE=$IMAGE_REPO:$TAG" >> $GITHUB_ENV

      - name: Connect to AKS cluster
        run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER }} --overwrite-existing

      - name: Install Ansible
        run: pip install ansible-core

      - name: Deploy with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml

      - name: Verify deployment status
        run: |
          kubectl get deployment cicd-app
          kubectl get pods -o wide
          kubectl get svc cicd-app-svc
