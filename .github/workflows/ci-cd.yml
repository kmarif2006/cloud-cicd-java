name: "CI/CD Pipeline — Azure AKS"

# ── TRIGGER ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── GLOBAL ENV ─────────────────────────────────────────────────────────────
env:
  ACR_NAME:       cicdkma4821
  IMAGE_NAME:     cicd-app
  RESOURCE_GROUP: cicd-rg
  AKS_CLUSTER:    cicd-aks
  JAVA_VERSION:   "17"

# ── JOBS ───────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build, test, package with Maven
  # ════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: "Build and Test (Maven)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Set up JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "Compile"
        run: mvn -B compile --no-transfer-progress

      - name: "Run unit and integration tests"
        run: mvn -B test --no-transfer-progress

      - name: "Package application"
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: "Upload test reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 30

      - name: "Upload application JAR"
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 1

  # ════════════════════════════════════════════════════════════════════════
  # JOB 2 — Docker build + push + AKS deploy
  # ════════════════════════════════════════════════════════════════════════
  docker-and-deploy:
    name: "Docker Build, Push and Deploy to AKS"
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Download application JAR"
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: "Verify JAR exists"
        run: ls -lh target/app.jar

      # ── Azure login (needed for AKS credentials later) ──────────────
      - name: "Login to Azure"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Get ACR credentials, then log in Docker daemon directly ──────
      - name: "Get ACR credentials and login Docker"
        id: acr-login
        run: |
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
          echo "$ACR_PASSWORD" | docker login "${{ env.ACR_NAME }}.azurecr.io" \
            --username "$ACR_USERNAME" --password-stdin
          echo "Docker login to ACR succeeded"

      # ── Build & push ─────────────────────────────────────────────────
      - name: "Build, tag and push Docker image"
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_REPO="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"

          echo "Building: $IMAGE_REPO:$SHORT_SHA"
          docker build \
            --build-arg APP_VERSION="$SHORT_SHA" \
            -t "$IMAGE_REPO:$SHORT_SHA" \
            -t "$IMAGE_REPO:latest" \
            .

          docker push "$IMAGE_REPO:$SHORT_SHA"
          docker push "$IMAGE_REPO:latest"

          echo "IMAGE=$IMAGE_REPO:$SHORT_SHA" >> $GITHUB_ENV
          echo "TAG=$SHORT_SHA"               >> $GITHUB_ENV
          echo "IMAGE_REPO=$IMAGE_REPO"       >> $GITHUB_ENV
          echo "Pushed $IMAGE_REPO:$SHORT_SHA and $IMAGE_REPO:latest"

      # ── Connect to AKS ────────────────────────────────────────────────
      - name: "Connect to AKS cluster"
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      # ── Install Ansible ───────────────────────────────────────────────
      - name: "Install Ansible"
        run: pip install ansible-core --quiet

      # ── Deploy via Ansible ────────────────────────────────────────────
      - name: "Deploy with Ansible to AKS"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            -v

      # ── Verify ───────────────────────────────────────────────────────
      - name: "Verify deployment status"
        run: |
          echo "=== Deployment ==="
          kubectl get deployment cicd-app -o wide
          echo "=== Pods ==="
          kubectl get pods -l app=cicd-app -o wide
          echo "=== Service ==="
          kubectl get svc cicd-app-svc

      # ── Summary ───────────────────────────────────────────────────────
      - name: "Write job summary"
        if: always()
        run: |
          echo "## Deployment Summary"                                           >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |"                                               >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|"                                               >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`$IMAGE\` |"                                     >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`$TAG\` |"                                         >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |"                         >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |"                 >> $GITHUB_STEP_SUMMARY
          echo "| **AKS Cluster** | \`${{ env.AKS_CLUSTER }}\` |"              >> $GITHUB_STEP_SUMMARY
          echo "| **Resource Group** | \`${{ env.RESOURCE_GROUP }}\` |"         >> $GITHUB_STEP_SUMMARY