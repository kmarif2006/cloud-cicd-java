<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Task Tracker — Cloud-native CI/CD demo on Azure AKS">
  <title>TaskFlow | Azure CI/CD Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── TOKENS ──────────────────────────────────────────────────────────── */
    :root {
      --bg-base:    #0d1117;
      --bg-surface: #161b22;
      --bg-card:    #1c2333;
      --bg-hover:   #2d333b;
      --border:     #30363d;
      --accent:     #2f81f7;
      --accent-glow:rgba(47,129,247,.25);
      --green:      #3fb950;
      --red:        #f85149;
      --orange:     #e3b341;
      --purple:     #bc8cff;
      --text-1:     #e6edf3;
      --text-2:     #8b949e;
      --text-3:     #484f58;
      --radius:     10px;
      --shadow:     0 4px 24px rgba(0,0,0,.4);
    }

    /* ─── RESET & BASE ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-1);
      min-height: 100vh;
    }

    /* ─── HEADER ──────────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #0d1117 0%, #1a2332 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), #79c0ff);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .logo h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
    .logo h1 span { color: var(--accent); }
    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    #msg { font-size: .9rem; color: var(--text-2); }
    #badge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: .75rem;
      color: var(--text-2);
      font-family: 'Courier New', monospace;
    }
    #badge span { color: var(--green); }

    /* ─── LAYOUT ──────────────────────────────────────────────────────────── */
    .app-grid {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media(max-width: 680px) {
      .app-grid { grid-template-columns: 1fr; }
    }

    /* ─── STAT CARDS ──────────────────────────────────────────────────────── */
    .sidebar {}
    .stat-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat .val { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat .lbl { font-size: .7rem; color: var(--text-2); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .stat.total .val { color: var(--accent); }
    .stat.done-s .val  { color: var(--green); }
    .stat.pending .val { color: var(--orange); }
    .stat.high-s .val  { color: var(--red); }

    /* ─── PRIORITY LEGEND ─────────────────────────────────────────────────── */
    .legend {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 20px;
    }
    .legend h3 { font-size: .8rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .leg-row { display: flex; align-items: center; gap: 8px; font-size: .82rem; margin-bottom: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.HIGH   { background: var(--red); }
    .dot.MEDIUM { background: var(--orange); }
    .dot.LOW    { background: var(--green); }

    /* ─── FORM PANEL ──────────────────────────────────────────────────────── */
    .form-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }
    .form-panel h3 { font-size: .8rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
    .field { margin-bottom: 10px; }
    label { font-size: .8rem; color: var(--text-2); display: block; margin-bottom: 4px; }
    input[type="text"], input[type="date"], select {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-1);
      padding: 9px 12px;
      font-size: .88rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    select option { background: var(--bg-card); }
    .btn-add {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), #58a6ff);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      margin-top: 4px;
    }
    .btn-add:hover { opacity: .88; transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    /* ─── FILTER BAR ──────────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .78rem;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ─── TASK LIST ───────────────────────────────────────────────────────── */
    #list { list-style: none; }
    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .2s, border-color .2s, transform .15s;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .task-item:hover { background: var(--bg-hover); transform: translateX(2px); }
    .task-item.HIGH   { border-left-color: var(--red); }
    .task-item.MEDIUM { border-left-color: var(--orange); }
    .task-item.LOW    { border-left-color: var(--green); }
    .task-item.done-task { opacity: .55; }
    .task-item.done-task .task-title { text-decoration: line-through; color: var(--text-2); }

    .task-check {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: all .2s;
      display: grid;
      place-items: center;
    }
    .task-check:hover { border-color: var(--green); }
    .task-item.done-task .task-check {
      background: var(--green);
      border-color: var(--green);
    }
    .task-check::after { content: ''; display: none; }
    .task-item.done-task .task-check::after {
      display: block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #fff;
    }

    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: .92rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-meta { font-size: .74rem; color: var(--text-2); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: .72rem;
      font-weight: 500;
    }
    .tag.HIGH   { background: rgba(248,81,73,.12);  color: var(--red); }
    .tag.MEDIUM { background: rgba(227,179,65,.12); color: var(--orange); }
    .tag.LOW    { background: rgba(63,185,80,.12);  color: var(--green); }
    .due-date   { color: var(--text-2); }
    .due-date.overdue { color: var(--red); }

    .btn-del {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-3);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: .8rem;
      transition: all .2s;
      flex-shrink: 0;
    }
    .btn-del:hover { background: rgba(248,81,73,.12); border-color: var(--red); color: var(--red); }

    /* ─── EMPTY STATE ─────────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-3);
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty p { font-size: .9rem; }

    /* ─── TOAST ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: .85rem;
      box-shadow: var(--shadow);
      transform: translateY(80px);
      opacity: 0;
      transition: all .3s cubic-bezier(.22,.68,0,1.2);
      pointer-events: none;
      z-index: 100;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red);   }

    /* ─── SCROLLBAR ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <h1>Task<span>Flow</span></h1>
  </div>
  <div class="header-meta">
    <span id="msg">Connecting to API…</span>
    <span id="badge">ver: <span id="ver">—</span> &nbsp;|&nbsp; pod: <span id="pod">—</span></span>
  </div>
</header>

<!-- MAIN GRID -->
<div class="app-grid">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">

    <!-- Stat Cards -->
    <div class="stat-cards">
      <div class="stat total">
        <div class="val" id="s-total">0</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat done-s">
        <div class="val" id="s-done">0</div>
        <div class="lbl">Done</div>
      </div>
      <div class="stat pending">
        <div class="val" id="s-pending">0</div>
        <div class="lbl">Pending</div>
      </div>
      <div class="stat high-s">
        <div class="val" id="s-high">0</div>
        <div class="lbl">High</div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <h3>Priority Legend</h3>
      <div class="leg-row"><span class="dot HIGH"></span> High — Urgent</div>
      <div class="leg-row"><span class="dot MEDIUM"></span> Medium — Normal</div>
      <div class="leg-row"><span class="dot LOW"></span> Low — Someday</div>
    </div>

    <!-- Add Task Form -->
    <div class="form-panel">
      <h3>New Task</h3>
      <form id="form">
        <div class="field">
          <label for="title">Task title</label>
          <input id="title" type="text" placeholder="e.g. Deploy to AKS…" required>
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="HIGH">🔴 High</option>
            <option value="MEDIUM" selected>🟡 Medium</option>
            <option value="LOW">🟢 Low</option>
          </select>
        </div>
        <div class="field">
          <label for="dueDate">Due date (optional)</label>
          <input id="dueDate" type="date">
        </div>
        <button class="btn-add" type="submit">+ Add Task</button>
      </form>
    </div>
  </aside>

  <!-- TASK PANEL -->
  <main>
    <!-- Filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="ALL">All</button>
      <button class="filter-btn" data-filter="PENDING">Pending</button>
      <button class="filter-btn" data-filter="DONE">Done</button>
      <button class="filter-btn" data-filter="HIGH">🔴 High</button>
      <button class="filter-btn" data-filter="MEDIUM">🟡 Medium</button>
      <button class="filter-btn" data-filter="LOW">🟢 Low</button>
    </div>
    <ul id="list"></ul>
  </main>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  // ─── STATE ──────────────────────────────────────────────────────────────
  let allTasks = [];
  let activeFilter = 'ALL';

  // ─── DOM REFS ────────────────────────────────────────────────────────────
  const $list    = document.getElementById('list');
  const $title   = document.getElementById('title');
  const $prio    = document.getElementById('priority');
  const $due     = document.getElementById('dueDate');
  const $msg     = document.getElementById('msg');
  const $ver     = document.getElementById('ver');
  const $pod     = document.getElementById('pod');
  const $sTotal  = document.getElementById('s-total');
  const $sDone   = document.getElementById('s-done');
  const $sPend   = document.getElementById('s-pending');
  const $sHigh   = document.getElementById('s-high');
  const $toast   = document.getElementById('toast');

  // ─── TOAST ───────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, type = 'success') {
    $toast.textContent = msg;
    $toast.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $toast.className = ''; }, 2800);
  }

  // ─── API HELPERS ─────────────────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.status === 204 ? null : res.json();
  }

  // ─── LOAD INFO ───────────────────────────────────────────────────────────
  async function loadInfo() {
    try {
      const info = await api('/api/info');
      $msg.textContent = info.message;
      $ver.textContent = info.version;
      $pod.textContent = info.host;
    } catch (e) { $msg.textContent = 'API unavailable'; }
  }

  // ─── LOAD STATS ──────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const s = await api('/api/stats');
      $sTotal.textContent  = s.total;
      $sDone.textContent   = s.done;
      $sPend.textContent   = s.pending;
      $sHigh.textContent   = (s.byPriority && s.byPriority.HIGH) || 0;
    } catch (_) {}
  }

  // ─── LOAD TASKS ──────────────────────────────────────────────────────────
  async function loadTasks() {
    try {
      allTasks = await api('/api/tasks');
      render();
      loadStats();
    } catch (e) { toast('Failed to load tasks', 'error'); }
  }

  // ─── FILTER & RENDER ─────────────────────────────────────────────────────
  function filtered() {
    return allTasks.filter(t => {
      if (activeFilter === 'DONE')    return t.done;
      if (activeFilter === 'PENDING') return !t.done;
      if (['HIGH','MEDIUM','LOW'].includes(activeFilter))
        return t.priority === activeFilter;
      return true;
    });
  }

  function render() {
    const tasks = filtered();
    $list.replaceChildren();
    if (tasks.length === 0) {
      $list.innerHTML = `<div class="empty"><div class="icon">📭</div><p>No tasks here. Add one!</p></div>`;
      return;
    }
    tasks.forEach(t => $list.appendChild(taskEl(t)));
  }

  function taskEl(t) {
    const today = new Date().toISOString().slice(0, 10);
    const isOverdue = t.dueDate && !t.done && t.dueDate < today;

    const li = document.createElement('li');
    li.className = `task-item ${t.priority}${t.done ? ' done-task' : ''}`;

    // Checkbox
    const chk = document.createElement('div');
    chk.className = 'task-check';
    chk.title = t.done ? 'Mark as pending' : 'Mark as done';
    chk.setAttribute('role', 'button');
    chk.setAttribute('tabindex', '0');
    chk.addEventListener('click', () => toggleTask(t.id));
    chk.addEventListener('keydown', e => e.key === 'Enter' && toggleTask(t.id));

    // Body
    const body = document.createElement('div');
    body.className = 'task-body';

    const titleEl = document.createElement('div');
    titleEl.className = 'task-title';
    titleEl.textContent = t.title;

    const meta = document.createElement('div');
    meta.className = 'task-meta';

    const tag = document.createElement('span');
    tag.className = `tag ${t.priority}`;
    tag.textContent = t.priority;
    meta.appendChild(tag);

    if (t.dueDate) {
      const due = document.createElement('span');
      due.className = `due-date${isOverdue ? ' overdue' : ''}`;
      due.textContent = (isOverdue ? '⚠ Overdue: ' : '📅 ') + t.dueDate;
      meta.appendChild(due);
    }

    body.appendChild(titleEl);
    body.appendChild(meta);

    // Delete btn
    const del = document.createElement('button');
    del.className = 'btn-del';
    del.textContent = '✕';
    del.title = 'Delete task';
    del.addEventListener('click', () => deleteTask(t.id));

    li.append(chk, body, del);
    return li;
  }

  // ─── ACTIONS ─────────────────────────────────────────────────────────────
  async function toggleTask(id) {
    try {
      const updated = await api(`/api/tasks/${id}/toggle`, { method: 'PUT' });
      allTasks = allTasks.map(t => t.id === id ? updated : t);
      render();
      loadStats();
      toast(updated.done ? '✅ Task completed!' : '↩ Task reopened');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function deleteTask(id) {
    try {
      await api(`/api/tasks/${id}`, { method: 'DELETE' });
      allTasks = allTasks.filter(t => t.id !== id);
      render();
      loadStats();
      toast('🗑 Task deleted');
    } catch (e) { toast(e.message, 'error'); }
  }

  // ─── FORM SUBMIT ─────────────────────────────────────────────────────────
  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const task = await api('/api/tasks', {
        method: 'POST',
        body: JSON.stringify({
          title:    $title.value,
          priority: $prio.value,
          dueDate:  $due.value || null
        })
      });
      allTasks.push(task);
      render();
      loadStats();
      $title.value = '';
      $due.value   = '';
      toast('✨ Task added!');
    } catch (e) { toast(e.message, 'error'); }
  });

  // ─── FILTER BUTTONS ──────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  // ─── INIT ────────────────────────────────────────────────────────────────
  loadInfo();
  loadTasks();
</script>
</body>
</html>
