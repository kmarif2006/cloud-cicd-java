---
- name: Deploy Task Tracker to Amazon EKS
  hosts: local
  gather_facts: false
  vars:
    image: "{{ lookup('env', 'IMAGE') }}"
    k8s_dir: "{{ playbook_dir }}/../k8s"
    rendered: /tmp/deployment.rendered.yaml

  tasks:
    - name: Render deployment manifest with the new image
      ansible.builtin.template:
        src: "{{ k8s_dir }}/deployment.yaml.j2"
        dest: "{{ rendered }}"
        mode: "0644"

    - name: Apply deployment
      ansible.builtin.command: kubectl apply -f {{ rendered }}
      changed_when: true

    - name: Apply service
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/service.yaml
      changed_when: true

    - name: Wait for rollout to finish
      ansible.builtin.command: kubectl rollout status deployment/cicd-app --timeout=180s
      changed_when: false

    - name: Get load balancer hostname
      ansible.builtin.command: >-
        kubectl get svc cicd-app-svc
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
      register: lb
      until: lb.stdout | length > 0
      retries: 20
      delay: 15
      changed_when: false

    - name: Verify application is reachable
      ansible.builtin.uri:
        url: "http://{{ lb.stdout }}/actuator/health"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 15

    - name: Show endpoint
      ansible.builtin.debug:
        msg: "Application is live at http://{{ lb.stdout }}"
