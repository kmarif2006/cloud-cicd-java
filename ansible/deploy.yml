---
# ============================================================
# Ansible Playbook — Deploy TaskFlow to Azure AKS
# Usage: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
# Required env vars: IMAGE (full image URL incl. tag), TAG (short SHA)
# ============================================================
- name: Deploy TaskFlow to Azure AKS
  hosts: local
  gather_facts: false

  vars:
    image:    "{{ lookup('env', 'IMAGE') }}"
    tag:      "{{ lookup('env', 'TAG')   | default('latest') }}"
    k8s_dir:  "{{ playbook_dir }}/../k8s"
    rendered: "/tmp/deployment-{{ tag }}.yaml"

  pre_tasks:
    - name: Validate required env vars
      ansible.builtin.assert:
        that:
          - image | length > 0
        fail_msg: "IMAGE environment variable must be set (full ACR image URL with tag)"

  tasks:
    # ── 1. Render Jinja2 deployment manifest ───────────────────────────
    - name: Render Kubernetes deployment manifest
      ansible.builtin.template:
        src:  "{{ k8s_dir }}/deployment.yaml.j2"
        dest: "{{ rendered }}"
        mode: "0644"

    - name: Show rendered manifest path
      ansible.builtin.debug:
        msg: "Rendered manifest: {{ rendered }}"

    # ── 2. Apply resources ─────────────────────────────────────────────
    - name: Apply Kubernetes deployment
      ansible.builtin.command: kubectl apply -f {{ rendered }}
      changed_when: true
      register: deploy_result

    - name: Apply Kubernetes service
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/service.yaml
      changed_when: true

    # ── 3. Wait for rollout ────────────────────────────────────────────
    - name: Wait for rollout to complete (max 3 min)
      ansible.builtin.command: kubectl rollout status deployment/cicd-app --timeout=180s
      changed_when: false
      register: rollout

    - name: Show rollout result
      ansible.builtin.debug:
        var: rollout.stdout_lines

    # ── 4. Discover LoadBalancer IP ────────────────────────────────────
    - name: Wait for LoadBalancer external IP to be assigned
      ansible.builtin.command: >-
        kubectl get svc cicd-app-svc
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: lb
      until: lb.stdout | length > 0
      retries: 24
      delay: 15
      changed_when: false

    - name: Store LB IP
      ansible.builtin.set_fact:
        lb_ip: "{{ lb.stdout }}"

    # ── 5. Health check ────────────────────────────────────────────────
    - name: Verify /actuator/health returns HTTP 200
      ansible.builtin.uri:
        url:         "http://{{ lb_ip }}/actuator/health"
        method:      GET
        status_code: 200
        timeout:     10
      register: health
      until:    health.status == 200
      retries:  20
      delay:    15

    # ── 6. Summary ─────────────────────────────────────────────────────
    - name: Deployment complete — print endpoint
      ansible.builtin.debug:
        msg:
          - "✅ Deployment successful!"
          - "🌐 Application URL : http://{{ lb_ip }}"
          - "📋 API Info        : http://{{ lb_ip }}/api/info"
          - "🏥 Health endpoint : http://{{ lb_ip }}/actuator/health"
          - "🐳 Image deployed  : {{ image }}"
          - "🏷  Tag             : {{ tag }}"
